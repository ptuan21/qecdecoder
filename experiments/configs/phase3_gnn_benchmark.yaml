# Phase 3 milestone (v2): train a GNN decoder per distance across several
# physical error rates (not just one) so it learns a rate-conditioned
# decision boundary via the DEM edge weights, instead of overfitting to a
# single noise level. Deliberately leaves some eval_physical_error_rates
# points out of the training set (0.06, 0.10, 0.15, 0.22, 0.26) as an
# interpolation generalization check.
# Phase 5: extended from [3, 5] to [3, 5, 7, 9] to match the Phase 2 MWPM
# baseline -- code-capacity graphs stay cheap at these distances (~0.14s/
# step on CPU for d=9), but still run this on GPU since 4 distances x 5
# training rates adds up.
# Phase 5 fix attempt #1: d=7/d=9 were catastrophically worse than MWPM at
# eval p=0.02 (~1000-4500x), which sits *below* the lowest training rate
# (0.04) -- i.e. the model was extrapolating there, not interpolating, and
# neural nets are known to extrapolate badly; the gap growing with distance
# is consistent with a harder/higher-dimensional decision boundary making
# that extrapolation cliff steeper. Added 0.02 to bracket the full eval
# range so this becomes an interpolation test everywhere. Result: real but
# partial improvement (~25-33% gap reduction at p=0.02) -- extrapolation
# was only part of the story.
#
# Phase 5 fix attempt #2: hypothesized the floor was a capacity/data-volume
# issue, so num_train_shots_per_rate (up to 4x) and hidden_channels (up to
# 1.5x) were scaled up for d=7/d=9. Result: essentially no change (d=7:
# 0.0346 -> 0.0319, d=9: 0.0602 -> 0.0594 at p=0.02) -- ruled out.
#
# Phase 5 fix attempt #3: switched GNNDecoder's pooling from
# global_mean_pool to global_add_pool (see model.py) -- mean pooling
# dilutes the signal from the handful of fired nodes more as num_nodes
# grows with distance, which fits the observed pattern (worse at larger d)
# better than a capacity/data explanation (which #2 ruled out). Reverted
# shots/hidden_channels to the attempt #1 baseline to isolate this change.
distances: [3, 5, 7, 9]
train_physical_error_rates: [0.02, 0.04, 0.08, 0.12, 0.18, 0.24]
eval_physical_error_rates: [0.02, 0.04, 0.06, 0.08, 0.10, 0.12, 0.15, 0.18, 0.22, 0.26]
num_train_shots_per_rate: 50000
num_val_shots_per_rate: 2000
num_eval_shots: 50000
hidden_channels: 32
num_layers: 3
batch_size: 512
epochs: 20
learning_rate: 0.001
rounds: 1
seed: 2026
